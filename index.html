  <style>/* inlined style.css to eliminate render-blocking request */
:root{--teal:#02d3cd;--teal-dark:#01b5b0;--navy:#023758;--navy-soft:#eef6fa;--text:#1c2b35;--muted:#5b6b76;--bg:#fff;--radius:14px}*{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.arrow-bounce{animation:none!important}}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased}a{color:var(--teal-dark);text-decoration:none}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}.hero{position:relative;height:100vh;height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem 1.5rem 5rem;background:radial-gradient(1200px 500px at 50% -10%,rgba(2,211,205,.14),transparent 70%),var(--bg)}.hero-logo{max-width:min(600px,92vw);height:auto;margin-bottom:2rem}.snap-root{scroll-snap-type:y mandatory;scroll-behavior:smooth;overflow-y:auto;height:100vh;height:100svh}.snap-section{scroll-snap-align:start;height:100vh;height:100svh;display:flex;flex-direction:column;justify-content:center;flex-shrink:0}.hero{padding-bottom:4rem}.scroll-cue{position:absolute;bottom:5rem;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.4rem;color:var(--teal-dark);font-size:.95rem;padding:.75rem 1rem;transition:opacity .3s ease,visibility .3s ease}.scroll-cue.hidden{opacity:0;visibility:hidden;pointer-events:none}.scroll-cue:hover{color:var(--navy)}.scroll-cue svg{width:1.6rem;height:1.6rem}.arrow-bounce{animation:bounce 2s infinite}@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}.scroll-dots{position:fixed;bottom:1.6rem;left:50%;transform:translateX(-50%);display:flex;gap:.65rem;z-index:900;padding:.5rem .8rem;background:rgba(255,255,255,.85);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:999px;border:1px solid rgba(0,0,0,.06);transition:opacity .3s ease,visibility .3s ease}.scroll-dots.hidden{opacity:0;visibility:hidden;pointer-events:none}.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--teal);background:transparent;cursor:pointer;padding:0;transition:background .25s ease,transform .25s ease}.dot:hover{background:rgba(2,211,205,.4)}.dot.active{background:var(--teal);transform:scale(1.35)}.btn{display:inline-flex;align-items:center;gap:.5rem;background:var(--navy);color:#fff;padding:.85rem 1.7rem;border-radius:999px;font-weight:600;cursor:pointer;border:none;font-size:1rem;transition:background .2s ease,transform .2s ease}.btn:hover{background:var(--teal-dark);transform:translateY(-1px)}.btn .mail-ico{width:1.05em;height:1.05em}.btn-teal{background:var(--teal);color:var(--navy)}.btn-teal:hover{background:var(--teal-dark)}.wrap{max-width:580px;margin:0 auto;padding:0 1.5rem}.section{height:100%;padding:2rem 1.5rem}.section-alt{background:var(--navy-soft)}.contact-card{background:#fff;border-radius:var(--radius);box-shadow:0 12px 36px rgba(2,55,88,.1);padding:2.4rem 2rem 2rem;text-align:center;max-width:420px;margin:0 auto}.contact-card h2{color:var(--navy);font-size:clamp(1.4rem,3vw,1.8rem);margin-bottom:.3rem}.contact-area{color:var(--muted);font-size:1rem;margin-bottom:1.4rem}.contact-card .btn{margin-bottom:.4rem}.divider{display:flex;align-items:center;gap:.8rem;margin:1.3rem 0;color:var(--muted);font-size:.85rem}.divider::before,.divider::after{content:"";flex:1;height:1px;background:#e3eaf0}#contactForm{text-align:left}#contactForm input,#contactForm textarea{width:100%;font-family:inherit;font-size:.95rem;padding:.7rem .9rem;border:1px solid #d2dce4;border-radius:8px;background:var(--bg);color:var(--text);transition:border-color .2s ease}#contactForm input:focus,#contactForm textarea:focus{outline:none;border-color:var(--teal)}#contactForm input{margin-bottom:.7rem}#contactForm textarea{resize:vertical;margin-bottom:1rem}#contactForm .btn{width:100%;justify-content:center;margin-bottom:0}.form-note{color:var(--muted);font-size:.78rem;margin-top:.7rem;text-align:center}.site-footer{background:var(--navy);color:rgba(255,255,255,.85);text-align:center;padding:1.1rem 1.5rem;font-size:.85rem}.site-footer a{color:var(--teal)}.site-footer .sep{opacity:.5;padding:0 .3rem}.policy{padding:3.5rem 1.5rem 5rem}.policy h1{color:var(--navy);font-size:clamp(1.6rem,4vw,2.2rem);margin-bottom:.5rem}.policy .updated{color:var(--muted);font-size:.9rem;margin-bottom:2rem}.policy h2{color:var(--navy);font-size:1.25rem;margin:2rem 0 .5rem}.policy p,.policy li{color:var(--muted);margin-bottom:.7rem}.policy ul{padding-left:1.4rem;margin-bottom:.7rem}.policy a{color:var(--teal-dark)}.policy .back{display:inline-block;margin-top:2rem;font-weight:600}.cookie-banner{position:fixed;left:1rem;right:1rem;bottom:1rem;background:var(--navy);color:#fff;padding:1.1rem 1.3rem;border-radius:var(--radius);box-shadow:0 18px 48px rgba(0,0,0,.3);z-index:1000;max-width:760px;margin:0 auto;display:none;font-size:.95rem}.cookie-banner.show{display:block}.cookie-banner .cb-text{margin-bottom:.9rem}.cookie-banner .cb-text a{color:var(--teal);text-decoration:underline}.cookie-banner .cb-actions{display:flex;gap:.7rem;flex-wrap:wrap}.cookie-banner .btn{background:var(--teal);color:var(--navy);padding:.6rem 1.3rem}.cookie-banner .btn:hover{background:var(--teal-dark)}.cookie-banner .btn-ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);padding:.6rem 1.3rem;border-radius:999px;font-weight:600;cursor:pointer}.cookie-banner .btn-ghost:hover{border-color:var(--teal);color:var(--teal)}</style>

<body>

  <main class="snap-root">
    <!-- HERO -->
    <header class="hero snap-section" id="top">
      <h1 class="sr-only">DiventaSmart - rendiamo smart gli spazi</h1>
      <picture>
        <source srcset="assets/all-380.webp 380w, assets/all-600.webp 600w, assets/all.webp 882w" sizes="min(600px, 92vw)" type="image/webp">
        <img class="hero-logo" src="assets/all.png" alt="DiventaSmart" width="882" height="180" fetchpriority="high">
      </picture>

      <a class="scroll-cue" href="#contatti" aria-label="Scopri di più, scorri verso il basso">
        <span>Scopri di più</span>
        <svg class="arrow-bounce" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </a>
    </header>

    <!-- CONTATTI -->
    <section class="section section-alt snap-section" id="contatti">
      <div class="wrap">
        <div class="contact-card">
          <h2>Contattaci</h2>
          <a class="btn" href="mailto:info@diventasmart.it">
            <svg class="mail-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 6l-10 7L2 6"/><rect x="2" y="6" width="20" height="12" rx="2"/></svg>
            info@diventasmart.it
          </a>

          <div class="divider"><span>oppure scrivici</span></div>

          <form id="contactForm">
            <input type="text" name="nome" placeholder="Il tuo nome" required autocomplete="name">
            <textarea name="messaggio" placeholder="Messaggio..." rows="3" required></textarea>
            <button type="submit" class="btn btn-teal">
              <svg class="mail-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2L11 13"/><path d="M22 2L15 22l-4-9-9-4L22 2z"/></svg>
              Invia email
            </button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <!-- FOOTER compatto -->
  <footer class="site-footer" id="footer">
